---
- name: Resolve local-part and email addresses
  ansible.builtin.set_fact:
    iw_local_part: "{{ iw_user_item.split('@')[0] }}"
    iw_source_email: "{{ iw_user_item if '@' in (iw_user_item | string) else (iw_user_item ~ '@' ~ iw_source_domain) }}"
    iw_dest_email: "{{ iw_user_item.split('@')[0] ~ '@' ~ iw_dest_domain }}"

- name: Assert source email belongs to the source domain
  ansible.builtin.assert:
    that:
      - ('@' not in (iw_user_item | string)) or (iw_user_item.split('@')[1] | lower == iw_source_domain | lower)
    fail_msg: "Account '{{ iw_user_item }}' is not in source domain '{{ iw_source_domain }}'."
    quiet: true

- name: Verify source account exists
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - export
      - account
      - "{{ iw_source_email }}"
  register: iw_src_acct_export
  changed_when: false
  check_mode: false
  failed_when: >-
    iw_src_acct_export.rc != 0
    or ('not found' in ((iw_src_acct_export.stdout ~ iw_src_acct_export.stderr) | lower))

- name: Verify destination domain exists
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - export
      - domain
      - "{{ iw_dest_domain }}"
  register: iw_dst_domain_export
  changed_when: false
  check_mode: false
  failed_when: >-
    iw_dst_domain_export.rc != 0
    or ('not found' in ((iw_dst_domain_export.stdout ~ iw_dst_domain_export.stderr) | lower))

- name: Verify destination account does not exist
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - export
      - account
      - "{{ iw_dest_email }}"
  register: iw_dst_acct_export
  changed_when: false
  check_mode: false
  failed_when: >-
    'not found' not in ((iw_dst_acct_export.stdout ~ iw_dst_acct_export.stderr) | lower)

- name: Export source u_mailbox
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - export
      - account
      - "{{ iw_source_email }}"
      - u_mailbox
  register: iw_mailbox_export
  changed_when: false
  check_mode: false
  failed_when: >-
    iw_mailbox_export.rc != 0
    or ('not found' in ((iw_mailbox_export.stdout ~ iw_mailbox_export.stderr) | lower))

- name: Export source u_autoarchivepath
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - export
      - account
      - "{{ iw_source_email }}"
      - u_autoarchivepath
  register: iw_archivepath_export
  changed_when: false
  check_mode: false
  failed_when: >-
    iw_archivepath_export.rc != 0
    or ('not found' in ((iw_archivepath_export.stdout ~ iw_archivepath_export.stderr) | lower))

- name: Set mailbox, archive, and SQL-escaped facts
  ansible.builtin.set_fact:
    iw_mailbox: "{{ (iw_mailbox_export.stdout.split(',')[1] | default('') | trim) if (iw_mailbox_export.stdout.split(',') | length > 1) else '' }}"
    iw_custom_archive: "{{ (iw_archivepath_export.stdout.split(',')[1] | default('') | trim) if (iw_archivepath_export.stdout.split(',') | length > 1) else '' }}"

- name: Assert u_mailbox is set
  ansible.builtin.assert:
    that:
      - iw_mailbox | length > 0
    fail_msg: "Could not resolve u_mailbox for '{{ iw_source_email }}' from tool.sh."
    quiet: true

- name: Set filesystem and SQL path facts
  ansible.builtin.set_fact:
    iw_src_maildir: "{{ iw_source_mailbox_path_n }}/{{ iw_mailbox }}"
    iw_dst_maildir: "{{ iw_dest_mailbox_path_n }}/{{ iw_mailbox }}"
    iw_src_archive: "{{ iw_source_archive_path_n }}/{{ iw_mailbox }}"
    iw_dst_archive: "{{ iw_dest_archive_path_n }}/{{ iw_mailbox }}"
    iw_dircache_old_prefix: "{{ iw_source_domain }}/{{ iw_mailbox }}"
    iw_dircache_new_prefix: "{{ iw_dest_domain }}/{{ iw_mailbox }}"
    iw_source_domain_sql: "{{ iw_source_domain | replace(\"'\", \"''\") }}"
    iw_dest_domain_sql: "{{ iw_dest_domain | replace(\"'\", \"''\") }}"
    iw_mailbox_sql: "{{ iw_mailbox | replace(\"'\", \"''\") }}"
    iw_source_email_sql: "{{ iw_source_email | replace(\"'\", \"''\") }}"
    iw_dest_email_sql: "{{ iw_dest_email | replace(\"'\", \"''\") }}"
    iw_src_maildir_sql: "{{ iw_source_mailbox_path_n }}/{{ iw_mailbox | replace(\"'\", \"''\") }}"
    iw_dst_maildir_sql: "{{ iw_dest_mailbox_path_n }}/{{ iw_mailbox | replace(\"'\", \"''\") }}"
    iw_dircache_old_prefix_sql: "{{ iw_source_domain | replace(\"'\", \"''\") }}/{{ iw_mailbox | replace(\"'\", \"''\") }}"
    iw_dircache_new_prefix_sql: "{{ iw_dest_domain | replace(\"'\", \"''\") }}/{{ iw_mailbox | replace(\"'\", \"''\") }}"

- name: Assert custom archive path is empty or matches inventory
  ansible.builtin.assert:
    that:
      - (iw_custom_archive | length == 0) or (iw_custom_archive.rstrip('/') == iw_src_archive)
    fail_msg: >-
      Custom u_autoarchivepath '{{ iw_custom_archive }}' for '{{ iw_source_email }}'
      does not match inventory source archive '{{ iw_src_archive }}'. Custom archive
      paths are not supported.
    quiet: true

- name: Stat source maildir
  ansible.builtin.stat:
    path: "{{ iw_src_maildir }}"
  register: iw_src_maildir_stat
  check_mode: false

- name: Stat destination maildir
  ansible.builtin.stat:
    path: "{{ iw_dst_maildir }}"
  register: iw_dst_maildir_stat
  check_mode: false

- name: Stat destination mailbox parent
  ansible.builtin.stat:
    path: "{{ iw_dest_mailbox_path_n }}"
  register: iw_dst_mailbox_parent_stat
  check_mode: false

- name: Stat source archive
  ansible.builtin.stat:
    path: "{{ iw_src_archive }}"
  register: iw_src_archive_stat
  check_mode: false

- name: Stat destination archive
  ansible.builtin.stat:
    path: "{{ iw_dst_archive }}"
  register: iw_dst_archive_stat
  check_mode: false

- name: Assert maildir and archive filesystem preconditions
  ansible.builtin.assert:
    that:
      - iw_src_maildir_stat.stat.exists | default(false)
      - iw_src_maildir_stat.stat.isdir | default(false)
      - not (iw_dst_maildir_stat.stat.exists | default(false))
      - iw_dst_mailbox_parent_stat.stat.exists | default(false)
      - iw_dst_mailbox_parent_stat.stat.isdir | default(false)
      - not (iw_dst_archive_stat.stat.exists | default(false))
    fail_msg: >-
      Filesystem preflight failed for '{{ iw_source_email }}'.
      Source maildir '{{ iw_src_maildir }}' must exist; destination maildir
      '{{ iw_dst_maildir }}' must not; destination mailbox parent
      '{{ iw_dest_mailbox_path_n }}' must exist; destination archive
      '{{ iw_dst_archive }}' must not exist.
    quiet: true

- name: Record whether a source archive directory exists
  ansible.builtin.set_fact:
    iw_archive_present: "{{ (iw_src_archive_stat.stat.exists | default(false)) and (iw_src_archive_stat.stat.isdir | default(false)) }}"
