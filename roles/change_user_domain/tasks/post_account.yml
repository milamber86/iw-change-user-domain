---
- name: Reset mailboxpath fact
  ansible.builtin.set_fact:
    iw_new_mailboxpath: ""

- name: Export destination u_mailboxpath
  when: iw_account_type | int != 2
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - export
      - account
      - "{{ iw_dest_email }}"
      - u_mailboxpath
  register: iw_mailboxpath_export
  changed_when: false
  failed_when: >-
    iw_mailboxpath_export.rc != 0
    or ('not found' in ((iw_mailboxpath_export.stdout ~ iw_mailboxpath_export.stderr) | lower))

- name: Set rewritten u_mailboxpath
  when: iw_account_type | int != 2
  ansible.builtin.set_fact:
    iw_new_mailboxpath: "{{ iw_mailboxpath_custom if (iw_custom_target | bool and (iw_mailboxpath_rewritten | length > 0)) else iw_mailboxpath_rewritten }}"
  vars:
    iw_mailboxpath_rewritten: "{{ (iw_mailboxpath_export.stdout.split(',')[1] | default('') | trim | regex_replace(iw_source_domain | regex_escape, iw_dest_domain)) if (iw_mailboxpath_export.stdout.split(',') | length > 1) else '' }}"
    iw_mailboxpath_custom: "{{ iw_dest_domain }}/{{ iw_dest_username }}/"

- name: Set destination u_mailboxpath
  when:
    - iw_account_type | int != 2
    - iw_new_mailboxpath | default('') | length > 0
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - set
      - account
      - "{{ iw_dest_email }}"
      - u_mailboxpath
      - "{{ iw_new_mailboxpath }}"
  register: iw_set_mailboxpath

- name: Log u_mailboxpath skip
  when: iw_account_type | int == 2 or (iw_new_mailboxpath | default('') | length == 0)
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "SKIP u_mailboxpath type={{ iw_account_type }} {{ iw_dest_email }}"

- name: Log u_mailboxpath set
  when:
    - iw_account_type | int != 2
    - iw_new_mailboxpath | default('') | length > 0
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "OK  u_mailboxpath {{ iw_dest_email }} {{ iw_new_mailboxpath }} rc={{ iw_set_mailboxpath.rc | default('n/a') }}"

- name: Stat destination webmail settings.xml
  ansible.builtin.stat:
    path: "{{ iw_dst_maildir }}/~webmail/settings.xml"
  register: iw_settings_xml_stat

- name: Rewrite address in webmail settings.xml
  when: iw_settings_xml_stat.stat.exists | default(false)
  ansible.builtin.replace:
    path: "{{ iw_dst_maildir }}/~webmail/settings.xml"
    regexp: "{{ (iw_source_email if (iw_custom_target | bool) else iw_source_domain) | regex_escape }}"
    replace: "{{ iw_dest_email if (iw_custom_target | bool) else iw_dest_domain }}"
  register: iw_settings_replace

- name: Log settings.xml rewrite
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "{{ 'OK  settings.xml ' ~ iw_dst_maildir ~ '/~webmail/settings.xml' if (iw_settings_xml_stat.stat.exists | default(false)) else ('SKIP settings.xml (absent) ' ~ iw_dst_maildir) }}"

- name: Refresh destination directory cache
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - set
      - account
      - "{{ iw_dest_email }}"
      - u_directorycache_refreshnow
      - "1"
  register: iw_dircache_refresh

- name: Log directory cache refresh
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "OK  u_directorycache_refreshnow {{ iw_dest_email }} rc={{ iw_dircache_refresh.rc | default('n/a') }}"

- name: Queue full-text reindex
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - set
      - account
      - "{{ iw_dest_email }}"
      - U_Fulltext_ReindexAccount
      - "1"
  register: iw_fulltext_reindex

- name: Log full-text reindex
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "OK  U_Fulltext_ReindexAccount {{ iw_dest_email }} rc={{ iw_fulltext_reindex.rc | default('n/a') }}"

- name: Re-enable destination account login
  when: iw_enable_login_after | bool
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - set
      - account
      - "{{ iw_dest_email }}"
      - u_accountdisabled
      - "0"
  register: iw_enable_login

- name: Log login re-enable
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "{{ ('OK  enable ' ~ iw_dest_email ~ ' rc=' ~ (iw_enable_login.rc | default('n/a') | string)) if (iw_enable_login_after | bool) else ('SKIP enable (iw_enable_login_after=false) ' ~ iw_dest_email) }}"
