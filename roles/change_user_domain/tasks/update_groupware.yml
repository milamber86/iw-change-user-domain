---
- name: Look up groupware EventOwner OWN_ID
  ansible.builtin.shell:
    cmd: >
      mysql --batch -N {{ iw_groupware_db | quote }} -e
      "SELECT OWN_ID FROM EventOwner
      WHERE OWN_Email = '{{ iw_source_email_sql }}';"
  register: iw_gw_own_query
  changed_when: false

- name: Set groupware OWN_IDs
  when: iw_gw_own_query.stdout | trim | length > 0
  ansible.builtin.set_fact:
    iw_gw_own_ids: "{{ iw_gw_own_query.stdout_lines | map('trim') | select() | list }}"
    iw_gw_own_ids_sql: "{{ \"'\" ~ (iw_gw_own_query.stdout_lines | map('trim') | select() | map('replace', \"'\", \"''\") | join(\"','\")) ~ \"'\" }}"

- name: Assert groupware OWN_ID values are safe identifiers
  when: iw_gw_own_query.stdout | trim | length > 0
  ansible.builtin.assert:
    that:
      - (iw_gw_own_ids | length) > 0
      - (iw_gw_own_ids | reject('regex', '^[A-Za-z0-9._-]+$') | list | length) == 0
    fail_msg: "Unexpected EventOwner OWN_ID values for '{{ iw_source_email }}': {{ iw_gw_own_query.stdout }}"
    quiet: true

- name: Update EventOwner and EventGroup emails
  when: iw_gw_own_query.stdout | trim | length > 0
  ansible.builtin.shell:
    cmd: |
      mysql --batch -N {{ iw_groupware_db | quote }} -e "
      START TRANSACTION;
      UPDATE EventOwner
        SET OWN_Email = '{{ iw_dest_email_sql }}'
        WHERE OWN_ID IN ({{ iw_gw_own_ids_sql }});
      UPDATE EventGroup
        SET GrpDailyEventsEmail = '{{ iw_dest_email_sql }}',
            GrpReminderEmail = '{{ iw_dest_email_sql }}'
        WHERE GRPOWN_ID IN ({{ iw_gw_own_ids_sql }});
      COMMIT;
      "
  register: iw_gw_owner_update

- name: Log EventOwner and EventGroup skip
  when: iw_gw_own_query.stdout | trim | length == 0
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "SKIP groupware EventOwner (no row) {{ iw_source_email }}"

- name: Log EventOwner and EventGroup update
  when: iw_gw_own_query.stdout | trim | length > 0
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "OK  groupware EventOwner/EventGroup {{ iw_source_email }} -> {{ iw_dest_email }} rc={{ iw_gw_owner_update.rc | default('n/a') }}"

- name: Update remaining groupware email columns
  ansible.builtin.shell:
    cmd: |
      mysql --batch -N {{ iw_groupware_db | quote }} -e "
      UPDATE folderrights
        SET FrtEmail = '{{ iw_dest_email_sql }}'
        WHERE FrtEmail = '{{ iw_source_email_sql }}';
      UPDATE eventcontact
        SET CntEmail = '{{ iw_dest_email_sql }}'
        WHERE CntEmail = '{{ iw_source_email_sql }}';
      UPDATE contactlocation
        SET LctEmail1 = '{{ iw_dest_email_sql }}'
        WHERE LctEmail1 = '{{ iw_source_email_sql }}';
      UPDATE contactlocation
        SET LctEmail2 = '{{ iw_dest_email_sql }}'
        WHERE LctEmail2 = '{{ iw_source_email_sql }}';
      UPDATE contactlocation
        SET LctEmail3 = '{{ iw_dest_email_sql }}'
        WHERE LctEmail3 = '{{ iw_source_email_sql }}';
      UPDATE eventpin
        SET PinOwnEmail = '{{ iw_dest_email_sql }}'
        WHERE PinOwnEmail = '{{ iw_source_email_sql }}';
      UPDATE globaleventpin
        SET PinOwnEmail = '{{ iw_dest_email_sql }}'
        WHERE PinOwnEmail = '{{ iw_source_email_sql }}';
      UPDATE eventmyreaction
        SET ReaOwnEmail = '{{ iw_dest_email_sql }}'
        WHERE ReaOwnEmail = '{{ iw_source_email_sql }}';
      UPDATE eventmymention
        SET MenWhoOwnEmail = '{{ iw_dest_email_sql }}'
        WHERE MenWhoOwnEmail = '{{ iw_source_email_sql }}';
      UPDATE eventmymention
        SET MenLinkEmail = '{{ iw_dest_email_sql }}'
        WHERE MenLinkEmail = '{{ iw_source_email_sql }}';
      "
  register: iw_gw_extra_update

- name: Log remaining groupware email updates
  ansible.builtin.include_tasks: log.yml
  vars:
    iw_log_message: "OK  groupware folderrights/contacts/pins/mentions {{ iw_source_email }} -> {{ iw_dest_email }} rc={{ iw_gw_extra_update.rc | default('n/a') }}"
