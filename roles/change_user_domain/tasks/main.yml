---
- name: Assert a user list or both inventory domains
  ansible.builtin.assert:
    that:
      - (iw_user | default('') | string | length > 0) or (iw_users | default([]) | length > 0) or ((iw_source_domain | length > 0) and (iw_dest_domain | length > 0))
      - (iw_source_domain | length == 0) or (iw_dest_domain | length == 0) or (iw_source_domain != iw_dest_domain)
    fail_msg: >-
      Set iw_users / iw_user (full emails, or local-parts with inventory domains),
      or set both iw_source_domain and iw_dest_domain for a whole-domain export.
      When both inventory domains are set, they must differ.
    quiet: true

- name: Initialize domain-change log
  ansible.builtin.include_tasks: init_log.yml

- name: Change account domains
  block:
    - name: Discover IceWarp databases and paths
      ansible.builtin.include_tasks: discover.yml

    - name: Assert discovered databases and roots are set
      ansible.builtin.assert:
        that:
          - iw_accounts_db | length > 0
          - iw_groupware_db | length > 0
          - iw_directorycache_db | length > 0
          - iw_eas_db | length > 0
          - iw_webclient_db | length > 0
          - iw_mail_path | length > 0
          - iw_archive_root | length > 0
          - iw_config_path | length > 0
        fail_msg: >-
          Could not discover IceWarp database names or mail/archive/config roots.
          Set them in inventory or extra-vars. See inventory/group_vars/all.example.yml.
        quiet: true

    - name: Log discovered databases and paths
      ansible.builtin.include_tasks: log.yml
      vars:
        iw_log_message: >-
          DISCOVER acc={{ iw_accounts_db }} gw={{ iw_groupware_db }} dc={{ iw_directorycache_db }}
          eas={{ iw_eas_db }} wc={{ iw_webclient_db }} mail={{ iw_mail_path }}
          archive={{ iw_archive_root }} config={{ iw_config_path }}

    - name: Normalize paths
      ansible.builtin.set_fact:
        iw_source_mailbox_path_n: "{{ iw_source_mailbox_path.rstrip('/') if (iw_source_mailbox_path | length > 0) else '' }}"
        iw_dest_mailbox_path_n: "{{ iw_dest_mailbox_path.rstrip('/') if (iw_dest_mailbox_path | length > 0) else '' }}"
        iw_source_archive_path_n: "{{ iw_source_archive_path.rstrip('/') if (iw_source_archive_path | length > 0) else '' }}"
        iw_dest_archive_path_n: "{{ iw_dest_archive_path.rstrip('/') if (iw_dest_archive_path | length > 0) else '' }}"
        iw_config_path_n: "{{ iw_config_path.rstrip('/') }}"
        iw_mail_path_n: "{{ iw_mail_path.rstrip('/') }}"
        iw_archive_root_n: "{{ iw_archive_root.rstrip('/') }}"
        iw_restart_needed: "{{ iw_restart_needed | default(false) | bool }}"

    - name: Resolve the account list
      ansible.builtin.include_tasks: resolve_account_list.yml

    - name: Assert at least one account will be migrated
      ansible.builtin.assert:
        that:
          - iw_users_resolved | length > 0
        fail_msg: "No accounts to migrate. Set iw_users / iw_user with emails, or export from the source domain."
        quiet: true

    - name: Collect unique source and dest domains
      ansible.builtin.include_tasks: collect_move_domains.yml

    - name: Log resolved account list
      ansible.builtin.include_tasks: log.yml
      vars:
        iw_log_message: "ACCOUNTS {{ iw_users_resolved | length }} {{ iw_users_resolved | join(' ') }}"

    - name: Ensure destination domains and directories
      ansible.builtin.include_tasks: ensure_dest_domain.yml

    - name: Disable all selected accounts
      when: not ansible_check_mode
      ansible.builtin.include_tasks: disable_all.yml

    - name: Restart IceWarp after disabling accounts
      when: not ansible_check_mode
      ansible.builtin.command:
        argv:
          - "{{ iw_icewarpd }}"
          - --restart
          - all
      register: iw_restart_after_disable
      timeout: 600

    - name: Log restart after disable
      when: not ansible_check_mode
      ansible.builtin.include_tasks: log.yml
      vars:
        iw_log_message: "OK  icewarpd --restart all (after disable) rc={{ iw_restart_after_disable.rc | default('skipped') }}"

    - name: Process each account
      ansible.builtin.include_tasks: process_user.yml
      loop: "{{ iw_users_resolved }}"
      loop_control:
        loop_var: iw_user_item
        label: "{{ iw_user_item }}"
  always:
    - name: Restart IceWarp services
      ansible.builtin.command:
        argv:
          - "{{ iw_icewarpd }}"
          - --restart
          - all
      register: iw_restart_final
      when: iw_restart_needed | default(false) | bool
      timeout: 600
      failed_when: false

    - name: Log final restart
      when: iw_restart_needed | default(false) | bool
      ansible.builtin.include_tasks: log.yml
      vars:
        iw_log_message: "{{ 'OK' if (iw_restart_final.rc | default(1) | int == 0) else 'FAIL' }}  icewarpd --restart all (final) rc={{ iw_restart_final.rc | default('n/a') }}"

    - name: Log play end
      ansible.builtin.include_tasks: log.yml
      vars:
        iw_log_message: "END log={{ iw_log_path }}"

    - name: Show domain-change log path
      ansible.builtin.debug:
        msg: "Domain change log: {{ iw_log_path }}"

    - name: Fail if final IceWarp restart failed
      when:
        - iw_restart_needed | default(false) | bool
        - iw_restart_final.rc | default(0) | int != 0
      ansible.builtin.fail:
        msg: "icewarpd --restart all failed with rc={{ iw_restart_final.rc }}. See {{ iw_log_path }}"
