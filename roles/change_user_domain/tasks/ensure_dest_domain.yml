---
- name: Stat IceWarp config path
  ansible.builtin.stat:
    path: "{{ iw_config_path_n }}"
  register: iw_config_root_stat
  check_mode: false

- name: Assert config path exists
  ansible.builtin.assert:
    that:
      - iw_config_root_stat.stat.exists | default(false)
      - iw_config_root_stat.stat.isdir | default(false)
    fail_msg: "Required config path '{{ iw_config_path_n }}' does not exist on the IceWarp host."
    quiet: true

- name: Stat source mailbox roots
  ansible.builtin.stat:
    path: "{{ iw_src_mail_root }}"
  loop: "{{ iw_unique_source_domains }}"
  loop_control:
    label: "{{ iw_src_mail_root }}"
  vars:
    iw_src_mail_root: "{{ iw_source_mailbox_path_n if ((iw_source_mailbox_path_n | length > 0) and (item | lower == (iw_source_domain | default('') | lower))) else (iw_mail_path_n ~ '/' ~ item) }}"
  register: iw_src_mail_root_stats
  check_mode: false

- name: Assert source mailbox roots exist
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
    fail_msg: "Required source mailbox path for domain '{{ item.item }}' does not exist on the IceWarp host."
    quiet: true
  loop: "{{ iw_src_mail_root_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure each destination domain and directories
  ansible.builtin.include_tasks: ensure_one_dest_domain.yml
  loop: "{{ iw_unique_dest_domains }}"
  loop_control:
    loop_var: iw_ensure_domain
    label: "{{ iw_ensure_domain }}"
