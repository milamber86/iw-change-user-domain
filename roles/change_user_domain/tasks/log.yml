---
# Expects iw_log_message. Appends one timestamped line to iw_log_path on the IceWarp host.
- name: Write domain-change log line
  ansible.builtin.shell:
    cmd: printf '%s  %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" {{ iw_log_message | quote }} >> {{ iw_log_path | quote }}
  changed_when: false
  failed_when: false
  check_mode: false
