---
- name: Disable login on all selected accounts
  ansible.builtin.command:
    argv:
      - "{{ iw_tool_sh }}"
      - set
      - account
      - "{{ iw_disable_email }}"
      - u_accountdisabled
      - "2"
  loop: "{{ iw_users_resolved }}"
  loop_control:
    loop_var: iw_disable_item
    label: "{{ iw_disable_email }}"
  vars:
    iw_disable_src: "{{ (iw_disable_item | string).split(',')[0] | trim }}"
    iw_disable_email: "{{ iw_disable_src if '@' in iw_disable_src else (iw_disable_src ~ '@' ~ iw_source_domain) }}"
  register: iw_disable_all_r
  failed_when: false

# #region agent log
- name: Debug ingest disable-loop result keys
  ansible.builtin.uri:
    url: http://127.0.0.1:7447/ingest/f20455b0-f63a-48e8-b144-f0d1b0b6b7e3
    method: POST
    body_format: json
    headers:
      Content-Type: application/json
      X-Debug-Session-Id: eb205e
    body:
      sessionId: eb205e
      runId: post-fix
      hypothesisId: A
      location: roles/change_user_domain/tasks/disable_all.yml
      message: disable register result keys
      timestamp: "{{ lookup('pipe', 'date +%s') | int * 1000 }}"
      data:
        result_keys: "{{ (iw_disable_all_r.results[0].keys() | list) if (iw_disable_all_r.results | default([]) | length > 0) else [] }}"
        has_item: "{{ (iw_disable_all_r.results | default([]) | length > 0) and ('item' in iw_disable_all_r.results[0]) }}"
        has_iw_disable_item: "{{ (iw_disable_all_r.results | default([]) | length > 0) and ('iw_disable_item' in iw_disable_all_r.results[0]) }}"
        first_loop_value: "{{ iw_disable_all_r.results[0].iw_disable_item | default(iw_disable_all_r.results[0].item | default('')) if (iw_disable_all_r.results | default([]) | length > 0) else '' }}"
        rc: "{{ iw_disable_all_r.results[0].rc | default('') if (iw_disable_all_r.results | default([]) | length > 0) else '' }}"
    status_code: [200, 201, 204]
  delegate_to: localhost
  become: false
  failed_when: false
# #endregion

- name: Log disable-login results
  ansible.builtin.include_tasks: log.yml
  loop: "{{ iw_disable_all_r.results }}"
  loop_control:
    loop_var: iw_disable_log
    label: "{{ iw_disable_log.iw_disable_item | default('account') }}"
  vars:
    iw_log_message: "{{ 'OK' if (iw_disable_log.rc | default(1) | int == 0) else 'FAIL' }}  disable {{ iw_disable_log.iw_disable_item | default('account') }} rc={{ iw_disable_log.rc | default('n/a') }}"

- name: Mark IceWarp restart as required
  ansible.builtin.set_fact:
    iw_restart_needed: true

- name: Fail if any account could not be disabled
  when: iw_disable_all_r.results | selectattr('rc', 'ne', 0) | list | length > 0
  ansible.builtin.fail:
    msg: "Failed to disable one or more accounts. See {{ iw_log_path }}"
