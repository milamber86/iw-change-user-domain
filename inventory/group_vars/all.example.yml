---
# Optional defaults. Full emails (user@domain) set that side's domain and are
# not overridden by these. Local-parts and whole-domain export still need both.
# iw_source_domain: olddomain.loc
# iw_dest_domain: newdomain.loc

# Optional. Local-parts, full source emails, or "old@src,new@dst" (mixed pairs OK).
# If omitted (and iw_user is not set), every account in iw_source_domain is moved
# (requires both inventory domains).
iw_users:
  - simone.jagl@noe.gruene.at,simone.jagl@parlamentsklub.gruene.at
  - other.user@foo.loc,other.user@bar.loc
  # - example.user

# Optional extra-var overrides (otherwise discovered from tool.sh / server.xml).
# Mailbox/archive path overrides apply only when the account domain equals the
# corresponding inventory domain; otherwise mail/<domain> and archive/<domain>.
# iw_source_mailbox_path: /opt/icewarp/mail/olddomain.loc/
# iw_dest_mailbox_path: /opt/icewarp/mail/newdomain.loc/
# iw_source_archive_path: /opt/icewarp/archive/olddomain.loc/
# iw_dest_archive_path: /opt/icewarp/archive/newdomain.loc/
# iw_mail_path: /opt/icewarp/mail
# iw_archive_root: /opt/icewarp/archive
# iw_config_path: /opt/icewarp/config
# iw_accounts_db: dbiwc127acc
# iw_groupware_db: dbiwc127gw
# iw_directorycache_db: dbiwc127dc
# iw_eas_db: dbiwc127eas
# iw_webclient_db: dbiwc127wc

# Optional. Leave login disabled after the move (u_accountdisabled 2).
# iw_enable_login_after: false

# Optional. Move log on the IceWarp host (default: /root/iw-change-user-domain-<timestamp>.log).
# iw_log_dir: /root
# iw_log_path: /root/iw-change-user-domain.log

# Optional paths and ownership.
# iw_tool_sh: /opt/icewarp/tool.sh
# iw_icewarpd: /opt/icewarp/icewarpd.sh
# iw_owner: icewarp
# iw_group: icewarp
